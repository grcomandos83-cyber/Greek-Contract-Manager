name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*' # Trigger when you push a tag like v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Executable
      run: |
        pyinstaller ContractManager.spec

    - name: Build Installer (Inno Setup)
      shell: pwsh
      run: |
        choco install innosetup --no-progress
        $tagVer = "${{ github.ref_name }}"
        if ($tagVer -and $tagVer.StartsWith("v")) {
          $ver = $tagVer.Substring(1)
        } elseif ($tagVer) {
          $ver = $tagVer
        } else {
          $ver = (Select-String -Path "constants.py" -Pattern 'APP_VERSION\s*=\s*["'']v?([^"'']+)["'']').Matches.Groups[1].Value
        }
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=$ver installer.iss

    - name: Prepare Release Assets
      shell: pwsh
      run: |
        if (Test-Path "dist/ContractManager_Setup.exe") {
          Copy-Item "dist/ContractManager_Setup.exe" "dist/ContractManager_Setup_Latest.exe"
        }

    - name: Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        generate_release_notes: true
        files: |
          dist/ContractManager_Setup.exe
          dist/ContractManager_Setup_Latest.exe
          dist/ContractManager.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

